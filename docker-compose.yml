version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_eventos_db
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: db_eventos
      MYSQL_USER: usuario_eventos
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - ./db/script_db.sql:/docker-entrypoint-initdb.d/script_db.sql
      - mysql_data:/var/lib/mysql
    networks:
      - eventos_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  mysql_data:

networks:
  eventos_network:
    driver: bridge
